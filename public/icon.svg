<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="100%" stop-color="#062e1c" />
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Green Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  
  <!-- Golf Course Green Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#22c55e" stroke-width="8" opacity="0.3" />
  
  <!-- Playing Cards Behind Flag -->
  <!-- Left Card (Spade/Club) -->
  <g transform="translate(190, 260) rotate(-18) translate(-90, -130)">
    <rect width="130" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
    <text x="18" y="36" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#0f172a">A</text>
    <text x="18" y="60" font-family="system-ui, sans-serif" font-size="20" fill="#0f172a">♠</text>
    <text x="65" y="115" font-family="system-ui, sans-serif" font-size="52" fill="#0f172a" text-anchor="middle">♠</text>
  </g>
  
  <!-- Right Card (Heart/Diamond) -->
  <g transform="translate(320, 260) rotate(18) translate(-40, -130)">
    <rect width="130" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
    <text x="18" y="36" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#dc2626">K</text>
    <text x="18" y="60" font-family="system-ui, sans-serif" font-size="20" fill="#dc2626">♥</text>
    <text x="65" y="115" font-family="system-ui, sans-serif" font-size="52" fill="#dc2626" text-anchor="middle">♥</text>
  </g>

  <!-- Golf Flagstick -->
  <!-- Hole at bottom -->
  <ellipse cx="256" cy="410" rx="60" ry="18" fill="#021f12" stroke="#15803d" stroke-width="4" />
  
  <!-- Flag Pin -->
  <path d="M253 110 L253 405" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="105" r="10" fill="url(#goldGrad)" />
  
  <!-- Flag Triangle -->
  <path d="M256 115 L370 160 L256 205 Z" fill="url(#flagGrad)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.3))" />
  
  <!-- Golf Ball -->
  <circle cx="210" cy="400" r="18" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))" />
  <circle cx="206" cy="396" r="3" fill="#cbd5e1" />
  <circle cx="214" cy="398" r="2.5" fill="#cbd5e1" />
  <circle cx="210" cy="404" r="2.5" fill="#cbd5e1" />
</svg>
